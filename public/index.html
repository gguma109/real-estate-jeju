<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>부동산 통합 관리 앱</title>
    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 기본 폰트 및 모바일 최적화 */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        .category-tab.active {
            background-color: #064e3b;
            color: white;
            border-bottom: 3px solid #fbbf24;
        }

        .dot-pulse {
            position: relative;
            left: -9999px;
            width: 10px;
            height: 10px;
            border-radius: 5px;
            background-color: #064e3b;
            color: #064e3b;
            box-shadow: 9999px 0 0 -5px #064e3b;
            animation: dotPulse 1.5s infinite linear;
            animation-delay: .25s;
        }

        .dot-pulse::before,
        .dot-pulse::after {
            content: '';
            display: inline-block;
            position: absolute;
            top: 0;
            width: 10px;
            height: 10px;
            border-radius: 5px;
            background-color: #064e3b;
            color: #064e3b;
        }

        .dot-pulse::before {
            box-shadow: 9984px 0 0 -5px #064e3b;
            animation: dotPulseBefore 1.5s infinite linear;
            animation-delay: 0s;
        }

        .dot-pulse::after {
            box-shadow: 10014px 0 0 -5px #064e3b;
            animation: dotPulseAfter 1.5s infinite linear;
            animation-delay: .5s;
        }

        @keyframes dotPulseBefore {
            0% {
                box-shadow: 9984px 0 0 -5px #064e3b;
            }

            30% {
                box-shadow: 9984px 0 0 2px #064e3b;
            }

            60%,
            100% {
                box-shadow: 9984px 0 0 -5px #064e3b;
            }
        }

        @keyframes dotPulse {
            0% {
                box-shadow: 9999px 0 0 -5px #064e3b;
            }

            30% {
                box-shadow: 9999px 0 0 2px #064e3b;
            }

            60%,
            100% {
                box-shadow: 9999px 0 0 -5px #064e3b;
            }
        }

        @keyframes dotPulseAfter {
            0% {
                box-shadow: 10014px 0 0 -5px #064e3b;
            }

            30% {
                box-shadow: 10014px 0 0 2px #064e3b;
            }

            60%,
            100% {
                box-shadow: 10014px 0 0 -5px #064e3b;
            }
        }

        /* 스켈레톤 애니메이션 */
        @keyframes shimmer {
            0% {
                background-position: -468px 0
            }

            100% {
                background-position: 468px 0
            }
        }

        .skeleton {
            background: #f6f7f8;
            background-image: linear-gradient(to right, #f6f7f8 0%, #edeef1 20%, #f6f7f8 40%, #f6f7f8 100%);
            background-repeat: no-repeat;
            background-size: 800px 104px;
            display: inline-block;
            position: relative;
            animation-duration: 1.2s;
            animation-fill-mode: forwards;
            animation-iteration-count: infinite;
            animation-name: shimmer;
            animation-timing-function: linear;
        }
    </style>
</head>

<body class="bg-gray-50 min-h-screen text-gray-800">
    <div id="app" class="max-w-md mx-auto bg-white min-h-screen shadow-lg pb-24">
        <!-- 탭 네비게이션 -->
        <header class="sticky top-0 z-50 bg-white border-b shadow-sm">
            <div class="flex justify-around items-center px-2 py-3">

                    class="category-tab active flex-1 py-2 text-sm font-bold transition-all rounded-lg mx-1">매물관리</button>
                <button onclick="switchTab('ads')" id="tab-ads"

                <button onclick="switchTab('notes')" id="tab-notes"

                <button onclick="switchTab('profile')" id="tab-profile"

            </div>
        </header>

        <!-- 1. 매물관리 (Rentals) 섹션 -->
        <section id="section-rentals" class="p-4">
            <div class="flex justify-between items-center mb-4">
                <h1 class="text-xl font-extrabold text-darkgreen flex items-center">
                    <span class="mr-2">🏠</span> 매물 목록
                </h1>
                <div class="flex gap-2">
                    <button onclick="showRentalModal()"
                        class="bg-darkgreen bg-emerald-800 text-white px-3 py-1.5 rounded-lg text-sm font-bold shadow-md hover:bg-emerald-700 active:scale-95 transition-all">
                        + 추가
                    </button>
                    <button onclick="loadRentalsFromCloud()" class="text-gray-400 hover:text-emerald-800">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15">
                            </path>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- 로딩바 -->
            <div id="loadingIndicatorRentals" class="hidden flex flex-col items-center justify-center py-20">
                <div class="dot-pulse"></div>

            </div>

            <!-- 매물 목록 -->
            <div id="rentals-list" class="space-y-4">
                <!-- JS에서 동적으로 생성 -->

        </section>

        <!-- 2. 광고매물 (Ads) 섹션 -->

                    <h1 class="text-xl font-extrabold text-darkgreen flex items-center">
                        <span class="mr-2">📢</span> 광고 매물 관리

                    <button onclick="openAdEditor()"

                <div id="ads-list" class="space-y-3">
                    <!-- 광고 매물 목록 -->

            </div>

            <div id="ads-editor-view" class="hidden">
                <div class="flex items-center mb-4">

                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7">
                            </path>

                <!-- 폼 영역 (반응형) -->

                    <div>
                        <label class="block text-xs font-bold text-gray-500 mb-1">카테고리 선택</label>

                            <option value="store">상가 (임대/매매)</option>
                            <option value="house">주택 & 건물</option>
                            <option value="land">토지</option>
                        </select>
                    </div>

                    <div id="ad-dynamic-fields" class="space-y-4">
                        <!-- 필드들이 동적으로 들어감 -->
                    </div>

                    <div class="pt-4 flex gap-2">
                        <button onclick="saveAd()"

                        <button onclick="copyAdDetails()"

                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3">
                                </path>

                    </div>

        </section>

        <!-- 3. 자유노트 (Notes) 섹션 -->

                <h1 class="text-xl font-extrabold text-darkgreen flex items-center">
                    <span class="mr-2">📝</span> 자유 노트

                    </div>
                </div>

                <button onclick="logout()" class="w-full bg-white text-red-500 py-3 rounded-xl font-bold border border-red-100 hover:bg-red-50 transition-all">
                    로그아웃

            <div class="mt-6 p-4 bg-gray-50 rounded-xl border border-gray-200">
                <h3 class="font-bold text-sm text-gray-600 mb-3">앱 정보</h3>
                <div class="space-y-2 text-xs text-gray-500">
                    <div class="flex justify-between">
                        <span>버전</span>
                        <span class="font-medium text-gray-700">v2.1.0</span>
                    </div>
                    <div class="flex justify-between">
                        <span>최근 업데이트</span>
                        <span class="font-medium text-gray-700">2024.05.13</span>
                    </div>

                    </path>

            <button onclick="switchTab('notes')" class="flex flex-col items-center gap-1 group">
                <svg class="w-6 h-6 text-gray-400 group-[.active]:text-emerald-800" fill="none" stroke="currentColor"
                    viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z">
                    </path>
                </svg>
                <span class="text-[10px] font-bold text-gray-400 group-[.active]:text-emerald-800">노트</span>
            </button>
            <button onclick="switchTab('profile')" class="flex flex-col items-center gap-1 group">
                <svg class="w-6 h-6 text-gray-400 group-[.active]:text-emerald-800" fill="none" stroke="currentColor"

                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"

                </svg>
                <span class="text-[10px] font-bold text-gray-400 group-[.active]:text-emerald-800">정보</span>
            </button>
        </nav>
    </div>

    <!-- 모달: 매물 상세/추가 (Rentals) -->
    <div id="rental-modal" class="hidden fixed inset-0 z-[60] flex items-end justify-center">
        <div class="fixed inset-0 bg-black/60 backdrop-blur-sm" onclick="closeRentalModal()"></div>
        <div class="bg-white w-full max-w-md rounded-t-3xl p-6 relative z-10 animate-in slide-in-from-bottom duration-300">
            <div class="w-12 h-1.5 bg-gray-200 rounded-full mx-auto mb-6"></div>
            <h2 id="modal-title" class="text-xl font-extrabold mb-6 text-emerald-900">새 매물 등록</h2>

            <form id="rental-form" class="space-y-4 max-h-[70vh] overflow-y-auto pb-6 px-1">
                <input type="hidden" id="rental-id">

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-gray-400 mb-1">매물 종류</label>
                        <select id="rental-type"
                            class="w-full p-3 rounded-xl border-2 border-gray-100 bg-gray-50 focus:border-emerald-500 focus:outline-none font-bold text-sm">
                            <option value="원룸">원룸</option>
                            <option value="투룸">투룸</option>
                            <option value="쓰리룸">쓰리룸</option>
                            <option value="공동주택">공동주택</option>
                            <option value="상가">상가</option>
                            <option value="건물">건물</option>
                            <option value="토지">토지</option>

                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-400 mb-1">진행 상태</label>
                        <select id="rental-status"
                            class="w-full p-3 rounded-xl border-2 border-gray-100 bg-gray-50 focus:border-emerald-500 focus:outline-none font-bold text-sm">
                            <option value="진행중">진행중</option>
                            <option value="계약예정">계약예정</option>
                            <option value="완료">완료</option>
                            <option value="보류">보류</option>
                        </select>

                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-400 mb-1">소재지 (주소)</label>
                    <input type="text" id="rental-address" placeholder="예) 제주시 노형동 123"

                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-gray-400 mb-1">보증금 (만원)</label>
                        <input type="number" id="rental-deposit" placeholder="0"
                            class="w-full p-3 rounded-xl border-2 border-gray-100 bg-gray-50 focus:border-emerald-500 focus:outline-none font-bold text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-400 mb-1">월세 (만원)</label>
                        <input type="number" id="rental-rent" placeholder="0"

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-gray-400 mb-1">관리비 (만원)</label>
                        <input type="number" id="rental-maintenance" placeholder="0"
                            class="w-full p-3 rounded-xl border-2 border-gray-100 bg-gray-50 focus:border-emerald-500 focus:outline-none font-bold text-sm">

                        <label class="block text-xs font-bold text-gray-400 mb-1">방 호수</label>
                        <input type="text" id="rental-room" placeholder="예) 201호"
                            class="w-full p-3 rounded-xl border-2 border-gray-100 bg-gray-50 focus:border-emerald-500 focus:outline-none font-bold text-sm">

                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-400 mb-1">특이사항</label>
                    <textarea id="rental-notes" rows="3" placeholder="옵션 정보, 세부 내용 등"
                        class="w-full p-3 rounded-xl border-2 border-gray-100 bg-gray-50 focus:border-emerald-500 focus:outline-none font-bold text-sm"></textarea>

                <button type="button" onclick="saveRental()"
                    class="w-full bg-emerald-800 text-white py-4 rounded-2xl font-bold shadow-lg shadow-emerald-200 active:scale-95 transition-all mt-4">
                    저장하기
                </button>
            </form>
        </div>
    </div>

    <!-- 스크립트 -->
    <script>
        // 전역 상태
        let rentals = [];
        let ads = [];
        let notes = [];
        let currentTab = 'rentals';
        let userProfile = null;

        // 초기화
        window.onload = async () => {
            await checkAuth();
            loadRentalsFromCloud();
            loadAdsFromCloud();
            loadNotesFromCloud();
            
            // 탭 초기화
            const urlParams = new URLSearchParams(window.location.search);
            const tab = urlParams.get('tab');
            if(tab) switchTab(tab);
        };

        // --- 인증 및 기본 통신 ---
        async function checkAuth() {
            try {
                const res = await fetch('/api/profile');
                const data = await res.json();
                if (data && data.success) {
                    userProfile = data.user;
                    updateProfileUI();
                } else {
                    window.location.href = '/login.html';
                }
            } catch (err) {
                console.error('Auth check failed', err);
            }
        }

        async function fetchWithAuth(url, options = {}) {
            const res = await fetch(url, options);
            if (res.status === 401) {
                window.location.href = '/login.html';
                return null;
            }
            return res.json();
        }

        // --- 탭 전환 ---
        function switchTab(tabId) {
            currentTab = tabId;
            document.querySelectorAll('section').forEach(s => s.classList.add('hidden'));
            document.getElementById(`section-${tabId}`).classList.remove('hidden');

            document.querySelectorAll('.category-tab').forEach(t => {
                t.classList.remove('active');
                t.classList.add('text-gray-500');
            });
            document.getElementById(`tab-${tabId}`).classList.add('active');
            document.getElementById(`tab-${tabId}`).classList.remove('text-gray-500');

            // 네비게이션 아이콘 업데이트
            document.querySelectorAll('nav button').forEach(btn => btn.classList.remove('active'));
            const navBtn = Array.from(document.querySelectorAll('nav button')).find(btn => btn.onclick.toString().includes(tabId));
            if (navBtn) navBtn.classList.add('active');
        }

        // --- 1. 매물관리 (Rentals) 로직 ---
        async function loadRentalsFromCloud() {
            document.getElementById('loadingIndicatorRentals').classList.remove('hidden');
            document.getElementById('rentals-list').innerHTML = '';

            const res = await fetchWithAuth('/api/rentals');
            document.getElementById('loadingIndicatorRentals').classList.add('hidden');

            if (res && res.success) {
                rentals = res.data;
                renderRentalsList();
                updateStats();
            }
        }

        function renderRentalsList() {
            const container = document.getElementById('rentals-list');
            if (rentals.length === 0) {
                container.innerHTML = '<div class="py-20 text-center text-gray-400">등록된 매물이 없습니다.</div>';
                return;
            }

            container.innerHTML = rentals.map(r => `
                <div class="bg-white p-4 rounded-2xl border border-gray-100 shadow-sm hover:shadow-md transition-all relative overflow-hidden group">
                    <div class="absolute top-0 left-0 w-1.5 h-full ${getStatusColor(r.status)}"></div>
                    <div class="flex justify-between items-start mb-2">
                        <div>
                            <span class="inline-block px-2 py-0.5 rounded text-[10px] font-extrabold ${getTypeColor(r.type)} mb-1">${r.type}</span>
                            <h3 class="font-extrabold text-gray-800 text-lg">${r.address} ${r.room || ''}</h3>
                        </div>
                        <span class="text-xs font-bold px-2 py-1 rounded-lg ${getStatusBadgeColor(r.status)}">${r.status}</span>
                    </div>
                    <div class="flex items-baseline gap-1 text-emerald-800 font-black text-xl mb-3">
                        <span class="text-sm">보</span>${r.deposit}<span class="text-xs font-bold text-gray-400 mx-1">/</span>
                        <span class="text-sm">월</span>${r.rent || r.yearly_rent || 0}
                        <span class="text-[10px] font-bold text-gray-400 ml-1">${r.yearly_rent ? '년세' : '월세'}</span>
                    </div>
                    <div class="flex gap-2">
                        <button onclick="editRental('${r.id}')" class="flex-1 bg-gray-50 text-gray-600 font-bold text-xs py-2 rounded-lg hover:bg-gray-100 transition-all">상세보기</button>
                        <button onclick="copyToClipboard('${r.id}')" class="text-darkgreen hover:text-white hover:bg-darkgreen font-bold text-xs px-3 py-1.5 rounded-lg border border-green-100 bg-green-50 shadow-sm active:scale-95 transition-all">카톡 복사</button>
                    </div>
                </div>
            `).join('');
        }

        function getStatusColor(status) {
            switch (status) {
                case '진행중': return 'bg-emerald-500';
                case '계약예정': return 'bg-amber-400';
                case '완료': return 'bg-gray-300';
                default: return 'bg-gray-200';
            }
        }

        function getStatusBadgeColor(status) {
            switch (status) {
                case '진행중': return 'bg-emerald-50 text-emerald-700';
                case '계약예정': return 'bg-amber-50 text-amber-700';
                case '완료': return 'bg-gray-50 text-gray-500';
                default: return 'bg-gray-50 text-gray-400';
            }
        }

        function getTypeColor(type) {
            switch (type) {
                case '원룸': return 'bg-blue-50 text-blue-600';
                case '투룸': return 'bg-indigo-50 text-indigo-600';
                case '쓰리룸': return 'bg-purple-50 text-purple-600';
                case '상가': return 'bg-orange-50 text-orange-600';
                default: return 'bg-gray-100 text-gray-600';
            }
        }

        function showRentalModal() {
            document.getElementById('modal-title').innerText = '새 매물 등록';
            document.getElementById('rental-form').reset();
            document.getElementById('rental-id').value = '';
            document.getElementById('rental-modal').classList.remove('hidden');
        }

        function closeRentalModal() {
            document.getElementById('rental-modal').classList.add('hidden');
        }

        function editRental(id) {
            const r = rentals.find(item => item.id === id);
            if (!r) return;

            document.getElementById('modal-title').innerText = '매물 정보 수정';
            document.getElementById('rental-id').value = r.id;
            document.getElementById('rental-type').value = r.type;
            document.getElementById('rental-status').value = r.status;
            document.getElementById('rental-address').value = r.address;
            document.getElementById('rental-deposit').value = r.deposit;
            document.getElementById('rental-rent').value = r.rent || r.yearly_rent || 0;
            document.getElementById('rental-maintenance').value = r.maintenance || 0;
            document.getElementById('rental-room').value = r.room || '';
            document.getElementById('rental-notes').value = r.special_notes || '';

            document.getElementById('rental-modal').classList.remove('hidden');
        }

        async function saveRental() {
            const id = document.getElementById('rental-id').value;
            const data = {
                type: document.getElementById('rental-type').value,
                status: document.getElementById('rental-status').value,
                address: document.getElementById('rental-address').value,
                deposit: parseInt(document.getElementById('rental-deposit').value) || 0,
                rent: parseInt(document.getElementById('rental-rent').value) || 0,
                maintenance: parseInt(document.getElementById('rental-maintenance').value) || 0,
                room: document.getElementById('rental-room').value,
                special_notes: document.getElementById('rental-notes').value
            };

            const url = id ? `/api/rentals?id=${id}` : '/api/rentals';
            const method = id ? 'PUT' : 'POST';

            const res = await fetchWithAuth(url, {
                method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            if (res && res.success) {
                closeRentalModal();
                loadRentalsFromCloud();
            } else {
                alert('저장 실패!');
            }
        }

        async function copyToClipboard(id) {
            const r = rentals.find(item => item.id === id);
            if (!r) return;

            const premiumStr = r.premium ? `\n- 권리금: ${r.premium}만원` : '';
            const rentStr = r.rent ? `\n- 월세: ${r.rent}만원` : (r.yearly_rent ? `\n- 년세: ${r.yearly_rent}만원` : '');
            const maintenanceStr = r.maintenance ? `\n- 관리비: ${r.maintenance}만원` : '';
            const addressStr = r.address ? `\n- 위치: ${r.address} ${r.room || ''}` : '';
            const areaStr = r.exclusive_area ? `\n- 면적: ${r.exclusive_area}` : '';
            const structureStr = r.structure ? `\n- 구조: ${r.structure}` : '';
            const optionsStr = r.options ? `\n- 옵션: ${r.options}` : '';
            const noteStr = r.special_notes ? `\n- 특이사항: ${r.special_notes}` : '';

            let buildingStr = '';
            if (['건물', '상가'].includes(r.type)) {
                const salePrice = parseFloat(r.sale_price) || 0;
                const loan = parseFloat(r.current_loan) || 0;
                const totalDeposit = parseFloat(r.total_deposit) || 0;
                const actualInv = salePrice - loan - totalDeposit;
                buildingStr = `\n\n[📊 수익률 분석]\n- 준공일: ${r.completion_date || '-'}\n- 세대구성: ${r.building_config || '-'}\n- 총보증금: ${r.total_deposit || 0}만원\n- 실투자금: ${actualInv}만원\n- 총월수입: ${r.total_monthly_income || 0}만원\n- 수익률(예상): 현장 문의`;
            }

            const text = `[${r.type} 매물정보]\n- 상태: ${r.status || '진행중'}\n- 가격: 보증금 ${r.deposit || 0}만원${rentStr}${premiumStr}${maintenanceStr}${addressStr}${areaStr}${structureStr}${optionsStr}${noteStr}${buildingStr}\n\n문의 부탁드립니다. 😊`;

            try {
                await navigator.clipboard.writeText(text);
                alert('카톡 공유용 텍스트가 복사되었습니다!');
            } catch (err) {
                alert('복사 실패: ' + err);
            }
        }

        // --- 2.5 자유노트 (Notes) 로직 ---
        async function loadNotesFromCloud() {
            document.getElementById('loadingIndicatorNotes').classList.remove('hidden');
            document.getElementById('notes-list').innerHTML = '';

            const res = await fetchWithAuth('/api/notes');
            document.getElementById('loadingIndicatorNotes').classList.add('hidden');

            if (res && res.success) {
                notes = res.data;
                renderNotesList();
                updateStats();
            }
        }

        function renderNotesList() {
            const container = document.getElementById('notes-list');
            if (notes.length === 0) {
                container.innerHTML = '<div class="py-10 text-center text-gray-400">저장된 노트가 없습니다.</div>';
                return;
            }

            container.innerHTML = notes.map(n => `
                <div class="bg-white p-4 rounded-xl border border-gray-100 shadow-sm relative group">
                    <div class="flex justify-between items-start mb-2">
                        <span class="text-[10px] text-gray-400 font-bold">${new Date(n.updated_at).toLocaleDateString()}</span>
                        <button onclick="deleteNote('${n.id}')" class="text-gray-300 hover:text-red-500 opacity-0 group-hover:opacity-100 transition-all">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                        </button>
                    </div>
                    <textarea onchange="updateNote('${n.id}', this.value)" class="w-full bg-transparent border-none focus:ring-0 text-sm font-medium text-gray-700 resize-none" rows="2">${n.content}</textarea>
                </div>
            `).join('');
        }

        async function addNote() {
            const res = await fetchWithAuth('/api/notes', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ content: '새로운 메모...' })
            });
            if (res && res.success) loadNotesFromCloud();
        }

        async function updateNote(id, content) {
            await fetchWithAuth(`/api/notes?id=${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ content })
            });
        }

        async function deleteNote(id) {
            if (confirm('삭제하시겠습니까?')) {
                await fetchWithAuth(`/api/notes?id=${id}`, { method: 'DELETE' });
                loadNotesFromCloud();
            }
        }

        // --- 기타 UI 업데이트 ---
        function updateProfileUI() {
            if (!userProfile) return;
            document.getElementById('profile-name').innerText = userProfile.name || '사용자';
            document.getElementById('profile-email').innerText = userProfile.email || '';
            document.getElementById('profile-initials').innerText = (userProfile.name || 'U').substring(0, 1);
        }

        function updateStats() {
            document.getElementById('stats-rentals').innerText = rentals.length;
            document.getElementById('stats-notes').innerText = notes.length;
        }

        function logout() {
            // 쿠키 삭제 등 (서버사이드 처리 권장)
            window.location.href = '/login.html';
        }

        // --- 광고 매물 (Ads) 상세 로직 ---
        async function loadAdsFromCloud() {
            const res = await fetchWithAuth('/api/ads');
            if (res && res.success) {
                ads = res.data;
                renderAdsList();
            }
        }

        function renderAdsList() {
            const container = document.getElementById('ads-list');
            if (!container) return;
            
            if (ads.length === 0) {
                container.innerHTML = '<div class="py-10 text-center text-gray-400">광고 매물이 없습니다.</div>';
                return;
            }

            container.innerHTML = ads.map(ad => `
                <div class="bg-white p-4 rounded-xl border border-gray-100 shadow-sm">
                    <div class="flex justify-between items-start mb-2">
                        <div>
                            <span class="text-[10px] font-bold text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded">${ad.category_name}</span>
                            <h3 class="font-bold text-gray-800 mt-1">${ad.title || '제목 없음'}</h3>
                        </div>
                        <div class="flex gap-2">
                            <button onclick="openAdEditor('${ad.id}')" class="text-xs font-bold text-gray-400 hover:text-emerald-800">수정</button>
                            <button onclick="deleteAd('${ad.id}')" class="text-xs font-bold text-gray-300 hover:text-red-500">삭제</button>
                        </div>
                    </div>
                    <p class="text-xs text-gray-500 line-clamp-1 mb-3">${ad.address || '주소 정보 없음'}</p>
                    <div class="flex justify-end">
                        <span class="text-[10px] text-gray-300">${new Date(ad.updated_at).toLocaleDateString()}</span>
                    </div>
                </div>
            `).join('');
        }

        let currentEditingAdId = null;

        function openAdEditor(id = null) {
            currentEditingAdId = id;
            document.getElementById('ads-list-view').classList.add('hidden');
            document.getElementById('ads-editor-view').classList.remove('hidden');

            const ad = id ? ads.find(a => a.id === id) : null;
            const categorySelect = document.getElementById('ad-category-select');
            
            if (ad) {
                categorySelect.value = ad.category_key;
            }
            
            renderAdFields(ad);
        }

        function renderAdFields(ad = null) {
            const category = document.getElementById('ad-category-select').value;
            const container = document.getElementById('ad-dynamic-fields');
            
            // 카테고리별 필드 정의
            const fields = {
                room: [
                    { key: 'title', label: '제목', type: 'text', placeholder: '예) 노형동 신축 원룸 임대' },
                    { key: 'agent', label: '담당자', type: 'text' },
                    { key: 'address', label: '소재지', type: 'text' },
                    { key: 'type', label: '종류', type: 'text', placeholder: '원룸, 투룸 등' },
                    { key: 'biz_name', label: '상호명', type: 'text' },
                    { key: 'price', label: '가격', type: 'text', placeholder: '보증금 500 / 월세 50' },
                    { key: 'area', label: '면적', type: 'text' },
                    { key: 'floor', label: '층수', type: 'text' },
                    { key: 'options', label: '옵션', type: 'text' },
                    { key: 'note', label: '특이사항', type: 'textarea' }
                ],
                store: [
                    { key: 'title', label: '제목', type: 'text' },
                    { key: 'agent', label: '담당자', type: 'text' },
                    { key: 'address', label: '소재지', type: 'text' },
                    { key: 'biz_type', label: '건축물용도', type: 'text' },
                    { key: 'biz_name', label: '상호명', type: 'text' },
                    { key: 'land_area', label: '대지면적', type: 'text' },
                    { key: 'area', label: '평수', type: 'text' },
                    { key: 'price', label: '가격', type: 'text' },
                    { key: 'premium', label: '권리금', type: 'text' },
                    { key: 'direction', label: '방향', type: 'text' },
                    { key: 'structure', label: '구조', type: 'text' },
                    { key: 'move_in', label: '입주정보', type: 'text' },
                    { key: 'note', label: '특이사항', type: 'textarea' }
                ],
                house: [
                    { key: 'title', label: '제목', type: 'text' },
                    { key: 'agent', label: '담당자', type: 'text' },
                    { key: 'address', label: '소재지', type: 'text' },
                    { key: 'note', label: '상세내용', type: 'textarea' }
                ],
                land: [
                    { key: 'title', label: '제목', type: 'text' },
                    { key: 'agent', label: '담당자', type: 'text' },
                    { key: 'address', label: '소재지', type: 'text' },
                    { key: 'area', label: '면적', type: 'text' },
                    { key: 'note', label: '상세내용', type: 'textarea' }
                ]
            };

            const selectedFields = fields[category] || [];
            container.innerHTML = selectedFields.map(f => {
                const value = ad ? (ad[f.key] || '') : '';
                if (f.type === 'textarea') {
                    return `
                        <div>
                            <label class="block text-xs font-bold text-gray-400 mb-1">${f.label}</label>
                            <textarea id="ad-field-${f.key}" class="w-full p-3 rounded-lg border-2 border-gray-100 focus:border-emerald-500 focus:outline-none text-sm font-bold" rows="4">${value}</textarea>
                        </div>
                    `;
                }
                return `
                    <div>
                        <label class="block text-xs font-bold text-gray-400 mb-1">${f.label}</label>
                        <input type="text" id="ad-field-${f.key}" value="${value}" placeholder="${f.placeholder || ''}" class="w-full p-3 rounded-lg border-2 border-gray-100 focus:border-emerald-500 focus:outline-none text-sm font-bold">
                    </div>
                `;
            }).join('');
        }

        async function saveAd() {
            const categorySelect = document.getElementById('ad-category-select');
            const categoryKey = categorySelect.value;
            const categoryName = categorySelect.options[categorySelect.selectedIndex].text;
            
            const inputs = document.querySelectorAll('[id^="ad-field-"]');
            const data = {
                category_key: categoryKey,
                category_name: categoryName,
                updated_at: new Date().toISOString()
            };

            inputs.forEach(input => {
                const key = input.id.replace('ad-field-', '');
                data[key] = input.value.trim();
            });

            const url = currentEditingAdId ? `/api/ads?id=${currentEditingAdId}` : '/api/ads';
            const method = currentEditingAdId ? 'PUT' : 'POST';

            const res = await fetchWithAuth(url, {
                method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            if (res && res.success) {
                alert('저장되었습니다.');
                closeAdEditor();
                loadAdsFromCloud();
            }
        }

        function closeAdEditor() {
            document.getElementById('ads-editor-view').classList.add('hidden');
            document.getElementById('ads-list-view').classList.remove('hidden');
            renderAdsList();
        }

        async function deleteAd(id) {
            if (confirm('이 매물을 영구 삭제하시겠습니까?')) {
                const res = await fetchWithAuth(`/api/ads?id=${id}`, { method: 'DELETE' });
                if (res && res.success) loadAdsFromCloud();
            }
        }

        async function copyAdDetails() {
            const inputs = document.querySelectorAll('[id^="ad-field-"]');
            let textParts = [];
            
            inputs.forEach(input => {
                const id = input.id;
                const key = id.replace('ad-field-', '');
                
                // 담당자, 종류, 상호명 제외 (소재지는 포함)
                const excludedKeys = ['agent', 'type', 'biz_name'];
                if (excludedKeys.includes(key)) return;
                
                const value = input.value.trim();
                if (!value) return;
                
                // 라벨 찾기
                const parent = input.parentElement;
                let labelText = '';
                
                // 일반적인 구조: parent > label
                let label = parent.querySelector('label');
                
                // 만약 부모의 이전 형제가 라벨인 경우
                if (!label) {
                    const prev = parent.previousElementSibling;
                    if (prev && prev.tagName === 'LABEL') label = prev;
                }
                
                if (label) {
                    labelText = label.innerText.replace(/\n/g, '').trim();
                } else {
                    labelText = key;
                }
                
                textParts.push(`${labelText}: ${value}`);
            });
            
            const finalContent = textParts.join('\n');
            if (finalContent) {
                try {
                    await navigator.clipboard.writeText(finalContent);
                    alert('입력된 내용이 복사되었습니다! (담당자, 종류, 상호명 제외)');
                } catch (err) {
                    const textArea = document.createElement("textarea");
                    textArea.value = finalContent;
                    document.body.appendChild(textArea);
                    textArea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textArea);
                    alert('입력된 내용이 복사되었습니다! (담당자, 종류, 상호명 제외)');
                }
            } else {
                alert('복사할 내용이 없습니다.');
            }
        }
    </script>
